# Ниша: русский бизнес / маркетинг / соцсети

search_queries:
  - "продвижение инстаграм shorts"
  - "маркетинг shorts"
  - "smm советы shorts"
  - "как набрать подписчиков instagram"
  - "reels маркетинг"
  - "продажи через instagram"

# Минимум просмотров для «залетевшего» ролика
min_views: 50000

# Максимальный возраст ролика (дни)
max_age_days: 14

# Скор: views / hours_since_publish — берём топ-N
top_n_per_query: 5

# Максимальная длительность Short (сек)
max_duration_sec: 60

instagram:
  hashtags:
    - "reelsмаркетинг"
    - "smmсоветы"
    - "продвижениеinstagram"
    - "контентзавод"
  accounts: []
  min_views: 50000
  max_age_days: 14
  max_duration_sec: 60
