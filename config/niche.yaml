# Ниша: русский бизнес / маркетинг / соцсети

search_queries:
  - "продвижение инстаграм советы"
  - "smm советы reels"
  - "как набрать подписчиков instagram"
  - "reels маркетинг стратегия"
  - "продажи через инстаграм"
  - "контент план инстаграм"

# Минимум просмотров для «залетевшего» ролика
min_views: 20000

# Максимальный возраст ролика (дни)
max_age_days: 14

# Скор: views / hours_since_publish — берём топ-N
top_n_per_query: 5

# Максимальная длительность Short (сек)
max_duration_sec: 60

# Отсекаем мемы/юмор из автопоиска
title_stopwords:
  - comedy
  - meme
  - memes
  - funny
  - юмор
  - прикол
  - приколы
  - sketch
  - stand up
  - standup

instagram:
  hashtags:
    - "reelsмаркетинг"
    - "smmсоветы"
    - "продвижениеinstagram"
    - "контентзавод"
  accounts: []
  min_views: 20000
  max_age_days: 14
  max_duration_sec: 60
