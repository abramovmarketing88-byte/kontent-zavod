services:
  worker:
    build: .
    env_file: .env
    network_mode: host
    environment:
      # Optional mihomo/Clash. Entrypoint clears these if :7890 is dead
      # unless PROXY_REQUIRED=true in .env
      HTTP_PROXY: ${HTTP_PROXY:-http://127.0.0.1:7890}
      HTTPS_PROXY: ${HTTPS_PROXY:-http://127.0.0.1:7890}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,192.168.0.0/16}
      PROXY_REQUIRED: ${PROXY_REQUIRED:-false}
    volumes:
      - ./output:/app/output
      - ./jobs:/app/jobs
      - ./data:/app/data
      - ./inbox:/app/inbox
      - ./brand:/app/brand
      - ./config:/app/config
      - ./reports:/app/reports
      - ./logs:/app/logs
      - ./scripts/docker-entrypoint.sh:/docker-entrypoint.sh:ro
