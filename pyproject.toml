[project]
name = "kontent-zavod"
version = "0.1.0"
description = "Automated faceless Reels content factory"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cursor-sdk>=0.1.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "apscheduler>=3.10.4",
    "yt-dlp>=2024.8.0",
    "faster-whisper>=1.0.0",
    "pydantic>=2.7.0",
    "openai>=1.40.0",
    "imageio-ffmpeg>=0.5.1",
    "edge-tts>=6.1.0",
    "instaloader>=4.13",
]

[project.scripts]
kontent-zavod = "src.pipeline:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
